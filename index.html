<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noordernacht</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #0b0b0b;
            color: #ffffff;
            scroll-behavior: smooth;
        }

        /* Hero Container */
        .hero {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: #000;
        }

        /* Background Video */
        .hero video {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translate(-50%, -50%);
            object-fit: cover;
            z-index: 1;
            filter: brightness(0.7);
        }

        /* Floating Ticket Button (rechtsboven) */
        .ticket-btn-container {
            position: fixed;
            top: 25px;
            right: 30px;
            z-index: 50;
        }

        .ticket-btn {
            background-color: #20e070;
            color: #0b0b0b;
            padding: 12px 28px;
            border-radius: 9999px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 4px 20px rgba(32, 224, 112, 0.35);
            transition: all 0.3s ease;
        }

        .ticket-btn:hover {
            background-color: #28f07c;
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 6px 28px rgba(32, 224, 112, 0.55);
        }

        /* Hero Content Container */
        .hero-content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 0 20px;
        }

        /* Logo styling */
        .hero-logo {
            width: 130%;
            max-width: 92vw;
            height: auto;
            margin-top: 30px;
            margin-bottom: 20px;
            filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.7));
            transition: transform 0.1s linear;
        }

        @media (min-width: 640px) {
            .hero-logo {
                width: 100%;
                max-width: 880px;
                margin-top: 0;
                margin-bottom: 24px;
            }
        }

        /* Payoff Subtitle */
        .hero-subtitle {
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #ffffff;
            font-size: 1.2rem;
            line-height: 1.4;
            text-shadow: 0 3px 12px rgba(0, 0, 0, 0.9);
            max-width: 90vw;
        }

        @media (min-width: 640px) {
            .hero-subtitle {
                font-size: 1.6rem;
                letter-spacing: 4px;
            }
        }

        /* Bouncing Scroll Arrow */
        .scroll-arrow {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            color: rgba(255, 255, 255, 0.75);
            animation: bounce 2s infinite;
            text-decoration: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .scroll-arrow svg {
            width: 32px;
            height: 32px;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translate(-50%, 0);
            }
            40% {
                transform: translate(-50%, -12px);
            }
            60% {
                transform: translate(-50%, -6px);
            }
        }

        /* Gradient Overlay voor de parallax-overgang naar beneden */
        .gradient-overlay {
            position: relative;
            z-index: 20;
            background: linear-gradient(to bottom, transparent 0%, rgba(11, 11, 11, 0.75) 25%, rgba(11, 11, 11, 0.95) 100%);
            padding: 120px
