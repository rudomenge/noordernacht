<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noordernacht</title>
    <!-- Webfonts inladen -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800&family=Bebas+Neue&family=Inter:wght@300;400;700;800&family=Syne:wght@800&display=swap" rel="stylesheet">
    <link href="https://api.fontshare.com/v2/css?f[]=clash-display@700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: 'Inter', sans-serif;
            background-color: #0b0b0b;
            color: #ffffff;
            scroll-behavior: smooth;
        }

        /* Hero Container */
        .hero {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-color: #000;
        }

        /* Background Video */
        .hero video {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translate(-50%, -50%);
            object-fit: cover;
            z-index: 1;
            filter: brightness(0.65);
        }

        /* Floating Ticket Button */
        .ticket-btn-container {
            position: fixed;
            top: 25px;
            right: 30px;
            z-index: 50;
        }

        .ticket-btn {
            background-color: #20e070;
            color: #0b0b0b;
            padding: 12px 28px;
            border-radius: 9999px;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 4px 20px rgba(32, 224, 112, 0.35);
            transition: all 0.3s ease;
        }

        .ticket-btn:hover {
            background-color: #28f07c;
            transform: translateY(-2px) scale(1.05);
        }

        /* Hero Content */
        .hero-content {
            position: relative;
            z-index: 30;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 0 20px;
        }

        /* Logo styling */
        .hero-logo {
            width: 130%;
            max-width: 92vw;
            height: auto;
            margin-top: 10px;
            margin-bottom: 15px;
            filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.7));
            transition: transform 0.1s linear;
            pointer-events: none;
        }

        @media (min-width: 640px) {
            .hero-logo {
                width: 100%;
                max-width: 880px;
                margin-top: 0;
                margin-bottom: 20px;
            }
        }

        /* Font Switcher Interactive Box */
        .font-switcher-box {
            cursor: pointer;
            background: rgba(0, 0, 0, 0.45);
            border: 2px solid #20e070;
            padding: 16px 24px;
            border-radius: 16px;
            backdrop-filter: blur(8px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8), 0 0 15px rgba(32, 224, 112, 0.2);
            transition: all 0.2s ease;
            user-select: none;
            max-width: 95vw;
        }

        .font-switcher-box:hover, .font-switcher-box:active {
            background: rgba(32, 224, 112, 0.15);
            border-color: #28f07c;
            transform: scale(1.02);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.9), 0 0 25px rgba(32, 224, 112, 0.4);
        }

        /* Font Indicator Badge */
        .font-badge {
            display: inline-block;
            background: #20e070;
            color: #0b0b0b;
            font-family: 'Inter', sans-serif;
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 6px 14px;
            border-radius: 20px;
            margin-bottom: 12px;
            pointer-events: none;
        }

        /* Payoff base style */
        .hero-subtitle {
            text-transform: uppercase;
            color: #ffffff;
            line-height: 1.3;
            text-shadow: 0 3px 12px rgba(0, 0, 0, 0.9);
            pointer-events: none;
        }

        .whitespace-nowrap {
            white-space: nowrap;
        }

        .click-hint {
            margin-top: 10px;
            font-size: 0.8rem;
            color: #20e070;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            pointer-events: none;
        }

        /* Scroll Arrow */
        .scroll-arrow {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            color: rgba(255, 255, 255, 0.75);
            animation: bounce 2s infinite;
            text-decoration: none;
        }

        .scroll-arrow svg { width: 32px; height: 32px; }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translate(-50%, 0); }
            40% { transform: translate(-50%, -12px); }
            60% { transform: translate(-50%, -6px); }
        }

        /* Info Section */
        .gradient-overlay {
            position: relative;
            z-index: 20;
            background: linear-gradient(to bottom, transparent 0%, rgba(11, 11, 11, 0.75) 25%, rgba(11, 11, 11, 0.95) 100%);
            padding: 120px 24px 100px 24px;
            text-align
