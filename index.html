<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noordernacht</title>
    <!-- Google Font Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: 'Inter', sans-serif;
            background-color: #0b0b0b;
            color: #ffffff;
            scroll-behavior: smooth;
        }

        /* Hero Sectie */
        .hero {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: #000;
        }

        /* Video op achtergrond */
        .hero video {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translate(-50%, -50%);
            object-fit: cover;
            z-index: 1;
            filter: brightness(0.65);
        }

        /* Floating Ticket Button */
        .ticket-btn-container {
            position: fixed;
            top: 25px;
            right: 30px;
            z-index: 50;
        }

        .ticket-btn {
            background-color: #20e070;
            color: #0b0b0b;
            padding: 12px 28px;
            border-radius: 9999px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 4px 20px rgba(32, 224, 112, 0.35);
        }

        /* Inhoud in het midden */
        .hero-content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 0 20px;
        }

        .hero-logo {
            width: 100%;
            max-width: 880px;
            height: auto;
            margin-bottom: 24px;
            filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.7));
        }

        .hero-subtitle {
            font-family: 'Inter', sans-serif;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #ffffff;
            font-size: 1.5rem;
            text-shadow: 0 3px 12px rgba(0, 0, 0, 0.9);
        }

        .whitespace-nowrap {
            white-space: nowrap;
        }

        /* Informatie / Parallax sectie */
        .gradient-overlay {
            position: relative;
            z-index: 20;
            background: linear-gradient(to bottom, transparent 0%, rgba(11, 11, 11, 0.8) 30%, #0b0b0b 100%);
            padding: 120px 24px 100px 24px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .gradient-overlay h2 {
            font-size: 2.2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 24px;
        }

        .gradient-overlay p {
            font-size: 1.15rem;
            color: #cccccc;
            max-width: 680px;
            margin: 0 auto 40px auto;
            line-height: 1.7;
        }

        .bottom-ticket-btn {
            background-color: #20e070;
            color: #0b0b0b;
            padding: 16px 40px;
            border-radius: 9999px;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="ticket-btn-container">
        <a href="#tickets" class="ticket-btn">Tickets</a>
    </div>

    <section class="hero">
        <video autoplay muted loop playsinline preload="auto">
            <source src="achtergrond.mp4" type="video/mp4">
        </video>

        <div class="hero-content">
            <img src="logo.png" alt="Noordernacht Logo" class="hero-logo">
            <div class="hero-subtitle">
                <span class="whitespace-nowrap">Find your people,</span> 
                <span class="whitespace-nowrap">Feel the moment</span>
            </div>
        </div>
    </section>

    <section class="gradient-overlay" id="tickets">
        <h2>Over Noordernacht</h2>
        <p>
            Noordernacht is dé plek waar gelijkgestemden samenkomen in het duister van de nacht. 
            Laat de meeslepende elektronische beats je meenemen en verlies jezelf in een betoverende sfeer.
        </p>
        <a href="#tickets" class="bottom-ticket-btn">Meteen Tickets Bestellen</a>
    </section>

</body>
</html>
