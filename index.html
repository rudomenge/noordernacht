<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noordernacht</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&family=Unbounded:wght@400..900&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: 'Inter', sans-serif;
            background-color: #0b0b0b;
            color: #ffffff;
            scroll-behavior: smooth;
            overflow-x: hidden;
        }

        .hero {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-color: #000;
        }

        .hero video {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translate(-50%, -50%);
            object-fit: cover;
            z-index: 1;
            filter: brightness(0.65);
        }

        .top-btn {
            background-color: #20e070;
            color: #0b0b0b;
            padding: 12px 28px;
            border-radius: 9999px;
            font-family: 'Unbounded', sans-serif;
            font-weight: 800;
            font-size: 0.85rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 4px 20px rgba(32, 224, 112, 0.35);
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
            outline: none;
        }

        .top-btn:hover {
            background-color: #28f07c;
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 6px 28px rgba(32, 224, 112, 0.55);
        }

        .anim-btn-container {
            position: fixed;
            top: 25px;
            left: 30px;
            z-index: 50;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .version-tag {
            font-family: 'Inter', sans-serif;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 6px;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .status-tag {
            font-family: 'Inter', sans-serif;
            font-size: 0.55rem;
            color: #20e070;
            margin-top: 3px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            font-weight: 700;
            text-align: center;
            max-width: 140px;
        }

        .ticket-btn-container {
            position: fixed;
            top: 25px;
            right: 30px;
            z-index: 50;
        }

        .hero-content {
            position: relative;
            z-index: 30;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 0 20px;
        }

        .hero-logo {
            width: 130%;
            max-width: 92vw;
            height: auto;
            margin-top: 10px;
            margin-bottom: 20px;
            filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.7));
            transition: transform 0.1s linear;
        }

        @media (min-width: 640px) {
            .hero-logo {
                width: 100%;
                max-width: 880px;
                margin-top: 0;
                margin-bottom: 24px;
            }
        }

        .hero-subtitle {
            font-family: 'Unbounded', sans-serif;
            font-weight: 800;
            text-transform: uppercase;
            color: #ffffff;
            line-height: 1.3;
            text-shadow: 0 3px 12px rgba(0, 0, 0, 0.9);
            max-width: 90vw;
            font-size: 1.15rem;
            letter-spacing: 2px;
            margin-top: 10px;
        }

        @media (min-width: 640px) {
            .hero-subtitle {
                font-size: 1.5rem;
                letter-spacing: 3px;
            }
        }

        .whitespace-nowrap {
            white-space: nowrap;
        }

        .floating-star-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 44px;
            height: 44px;
            pointer-events: none;
            z-index: 9999;
            will-change: transform;
            filter: drop-shadow(0 0 12px rgba(32, 224, 112, 0.9));
        }

        .scroll-arrow {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            color: rgba(255, 255, 255, 0.75);
            animation: bounce 2s infinite;
            text-decoration: none;
        }

        .scroll-arrow svg { width: 32px; height: 32px; }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translate(-50%, 0); }
            40% { transform: translate(-50%, -12px); }
            60% { transform: translate(-50%, -6px); }
        }

        .gradient-overlay {
            position: relative;
            z-index: 20;
            background: linear-gradient(to bottom, rgba(0,0,0,0.85) 0%, #0b0b0b 20%, #0b0b0b 100%);
            padding: 180px 24px 160px 24px;
            min-height: 100vh;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .gradient-overlay h2 {
            font-family: 'Unbounded', sans-serif;
            font-weight: 800;
            font-size: 2.2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 32px;
            max-width: 95vw;
        }

        @media (min-width: 640px) {
            .gradient-overlay h2 {
                font-size: 3.5rem;
                letter-spacing: 3px;
            }
        }

        .gradient-overlay p {
            font-family: 'Inter', sans-serif;
            font-weight: 300;
            font-size: 1.25rem;
            color: #cccccc;
            max-width: 720px;
            margin: 0 auto 50px auto;
            line-height: 1.8;
        }

        .bottom-ticket-btn {
            background-color: #20e070;
            color: #0b0b0b;
            padding: 16px 40px;
            border-radius: 9999px;
            font-family: 'Unbounded', sans-serif;
            font-size: 1rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 6px 24px rgba(32, 224, 112, 0.4);
            transition: all 0.3s ease;
        }

        .bottom-ticket-btn:hover {
            background-color: #28f07c;
            transform: translateY(-3px) scale(1.05);
        }
    </style>
</head>
<body>

    <div id="starContainer" class="floating-star-container">
        <svg viewBox="0 0 100 100" width="100%" height="100%" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M50 0 Q50 50 100 50 Q50 50 50 100 Q50 50 0 50 Q50 50 50 0 Z" fill="#20e070"/>
        </svg>
    </div>

    <div class="anim-btn-container">
        <button id="animBtn" class="top-btn" type="button">Animatie</button>
        <span class="version-tag">v19.0</span>
        <span id="statusSubTag" class="status-tag">TRAIL (SLOW)</span>
    </div>

    <div class="ticket-btn-container">
        <a href="#tickets" class="top-btn">Tickets</a>
    </div>

    <section class="hero">
