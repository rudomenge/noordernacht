<!-- Versie: 33.1 - Noordernacht: accentkleur #ff9b56, Agenda-knop, transparante payoff op desktop, foto-carousel, klein versienummer -->
<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noordernacht</title>

    <!-- Google Fonts: Unbounded (Headers/Knoppen) + Inter (Broodtekst) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&family=Unbounded:wght@400..900&display=swap" rel="stylesheet">

    <style>
        :root {
            --accent: #ff9b56;
            --accent-hover: #ffae70;
            --accent-glow: rgba(255, 155, 86, 0.35);
            --accent-glow-hover: rgba(255, 155, 86, 0.55);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: 'Inter', sans-serif;
            background-color: #000;
            color: #ffffff;
            scroll-behavior: smooth;
            overflow-x: hidden;
        }

        /* Klein versienummer linksboven */
        .version-tag {
            position: fixed;
            top: 12px;
            left: 14px;
            z-index: 60;
            font-family: 'Inter', sans-serif;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.5);
            pointer-events: none;
        }

        @media (min-width: 640px) {
            .version-tag {
                top: 20px;
                left: 20px;
            }
        }

        /* Hulpklassen: andere regelafbreking en andere tekst per schermbreedte */
        .d-only { display: none; }
        .m-only { display: inline; }

        @media (min-width: 640px) {
            .m-br { display: none; }
            .d-only { display: inline; }
            .m-only { display: none; }
        }

        /* Hero Container */
        .hero {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-color: #000;
        }

        /* Background Video */
        .hero video {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translate(-50%, -50%);
            object-fit: cover;
            z-index: 1;
            filter: brightness(0.7);
        }

        /* Subtiele Interlace Overlay */
        .hero-interlace-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%,
                rgba(0, 0, 0, 0.3) 50%
            );
            background-size: 100% 4px;
            opacity: 0.5;
        }

        /* Knoppen bovenin: Tickets rechts, Agenda links (alleen desktop) */
        .ticket-btn-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 50;
        }

        .agenda-btn-container {
            position: fixed;
            top: 60px;
            left: 60px;
            z-index: 50;
            display: none;
        }

        .top-btn,
        .bottom-ticket-btn {
            background-color: var(--accent);
            color: #0b0b0b;
            padding: 2px 13px;
            border-radius: 9999px;
            font-family: 'Unbounded', sans-serif;
            font-weight: 800;
            font-size: 0.85rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 4px 20px var(--accent-glow);
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
            outline: none;
        }

        .top-btn:hover,
        .bottom-ticket-btn:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 6px 28px var(--accent-glow-hover);
        }

        @media (min-width: 640px) {
            .ticket-btn-container {
                top: 60px;
                right: 60px;
            }

            .agenda-btn-container { display: block; }

            .top-btn {
                font-size: 1.6rem;
                padding: 5px 24px;
            }

            .bottom-ticket-btn {
                font-size: 2rem;
                padding: 5px 40px;
            }
        }

        .hero-content {
            position: relative;
