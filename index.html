<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noordernacht</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #0b0b0b;
            color: #ffffff;
            scroll-behavior: smooth;
        }

        /* Hero sectie met achtergrondvideo */
        .hero {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: #000; /* Zwarte achtergrond als fallback voor de video */
        }

        .hero video {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translate(-50%, -50%);
            object-fit: cover;
            z-index: 1; /* Duidelijk op laag 1 gezet */
            filter: brightness(0.7);
        }

        /* Glasmorphism Header (Bovenkant) */
        header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            background: rgba(11, 11, 11, 0.3);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 20; /* Boven alles */
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .nav-title {
            font-size: 1.2rem;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .ticket-btn {
            background: #ffffff;
            color: #0b0b0b;
            padding: 10px 25px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .ticket-btn:hover {
            background: rgba(255, 255, 255, 0.8);
            transform: scale(1.05);
        }

        /* Centraal zwevend logo + slogan */
        .hero-content {
            position: relative;
            text-align: center;
            z-index: 10; /* Ligt boven de video (z-index 1) */
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 20px;
        }

        .hero-logo {
            width: 320px;
            max-width: 80vw;
            height: auto;
            margin-bottom: 15px;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5));
        }

        .hero-subtitle {
            font-size: 1.3rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 300;
            color: #f1f1f1;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        /* Informatie / Parallax sectie onder de video */
        .info-section {
            padding: 100px 20px;
            background: #0b0b0b;
            text-align: center;
            position: relative;
            z-index: 10;
        }

        .info-section h2 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        .info-section p {
            font-size: 1.1rem;
            color: #aaaaaa;
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <!-- Header met kleine navigatie -->
    <header>
        <div class="nav-title">Noordernacht</div>
        <a href="#tickets" class="ticket-btn">Tickets</a>
    </header>

    <!-- Hero Sectie met Achtergrondvideo en Centraal Logo -->
    <section class="hero">
        <video autoplay muted loop playsinline preload="auto">
            <source src="achtergrond.mp4" type="video/mp4">
            Je browser ondersteunt geen video.
        </video>

        <div class="hero-content">
            <!-- Het geüploadde logo -->
            <img src="logo.png" alt="Noordernacht Logo" class="hero-logo">
            <div class="hero-subtitle">Find your people, Feel the moment</div>
        </div>
    </section>

    <!-- Informatie Sectie -->
    <section class="info-section" id="tickets">
        <h2>Over Noordernacht</h2>
        <p>Duister, elektronisch en betoverend. Beleef de ultieme nacht waarin muziek en samenzijn samenkomen op een unieke locatie in het Noorden.</p>
    </section>

</body>
</html>
