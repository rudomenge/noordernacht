<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noordernacht</title>
    
    <!-- Unbounded (Headers, Payoff, Knoppen) + Inter (Broodtekst) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&family=Unbounded:wght@700;800;900&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: 'Inter', sans-serif;
            background-color: #0b0b0b;
            color: #ffffff;
            scroll-behavior: smooth;
            overflow-x: hidden;
        }

        /* Hero Container */
        .hero {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-color: #000;
        }

        /* Background Video */
        .hero video {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translate(-50%, -50%);
            object-fit: cover;
            z-index: 1;
            filter: brightness(0.65);
        }

        /* Top Buttons Base (Nu in Unbounded) */
        .top-btn {
            background-color: #20e070;
            color: #0b0b0b;
            padding: 12px 28px;
            border-radius: 9999px;
            font-family: 'Unbounded', sans-serif;
            font-weight: 800;
            font-size: 0.85rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 4px 20px rgba(32, 224, 112, 0.35);
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
            outline: none;
        }

        .top-btn:hover {
            background-color: #28f07c;
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 6px 28px rgba(32, 224, 112, 0.55);
        }

        /* Animatie Knop Linksboven + Versie Tag */
        .anim-btn-container {
            position: fixed;
            top: 25px;
            left: 30px;
            z-index: 50;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .version-tag {
            font-family: 'Inter', sans-serif;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 6px;
            letter-spacing: 1px;
            font-weight: 400;
        }

        /* Ticket Knop Rechtsboven */
        .ticket-btn-container {
            position: fixed;
            top: 25px;
            right: 30px;
            z-index: 50;
        }

        /* Hero Content */
        .hero-content {
            position: relative;
            z-index: 30;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 0 20px;
        }

        /* Logo styling */
        .hero-logo {
            width: 130%;
            max-width: 92vw;
            height: auto;
            margin-top: 10px;
            margin-bottom: 20px;
            filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.7));
            transition: transform 0.1s linear;
        }

        @media (min-width: 640px) {
            .hero-logo {
                width: 100%;
                max-width: 880px;
                margin-top: 0;
                margin-bottom: 24px;
            }
        }

        /* Subtiel groen bolletje + indicatie */
        .anim-indicator-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(32, 224, 112, 0.4);
            color: #20e070;
            font-family: 'Inter', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 12px;
            backdrop-filter: blur(4px);
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: #20e070;
            border-radius: 50%;
            box-shadow: 0 0 8px #20e070;
        }

        /* Payoff in Unbounded */
        .hero-subtitle {
            font-family: 'Unbounded', sans-serif;
            font-weight: 800;
            text-transform: uppercase;
            color: #ffffff;
            line-height: 1.3;
            text-shadow: 0 3px 12px rgba(0, 0, 0, 0.9);
            max-width: 90vw;
            font-size: 1.15rem;
            letter-spacing: 2px;
        }

        @media (min-width: 640px) {
            .hero-subtitle {
                font-size: 1.5rem;
                letter-spacing: 3px;
            }
        }

        .whitespace-nowrap {
            white-space: nowrap;
        }

        /* Zwevend Sterretje SVG Element */
        .floating-star {
            position: fixed;
            top: 0;
            left: 0;
            width: 38px;
            height: 38px;
            pointer-events: none;
            z-index: 9999;
            filter: drop-shadow(0 0 10px rgba(32, 224, 112, 0.8));
            transform: translate(-50%, -50%);
            transition: opacity 0.3s ease;
        }

        /* Scroll Arrow */
        .scroll-arrow {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            color: rgba(255, 255, 255, 0.75);
            animation: bounce 2s infinite;
            text-decoration: none;
        }

        .scroll-arrow svg { width: 32px; height: 32px; }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translate(-50%, 0); }
            40% { transform: translate(-50%, -12px); }
            60% { transform: translate(-50%, -6px); }
        }

        /* Info Section */
        .gradient-overlay {
            position: relative;
            z-index: 20;
            background: linear-gradient(to bottom, transparent 0%, rgba(11, 11, 11, 0.75) 25%, rgba(11, 11, 11, 0.95) 100%);
            padding: 120px 24px 100px 24px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Kop "Over Noordernacht" in Unbounded */
        .gradient-overlay h2 {
            font-family: 'Unbounded', sans-serif;
            font-weight: 800;
            font-size: 2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 28px;
            max-width: 95vw;
        }

        @media (min-width: 640px) {
            .gradient-overlay h2 {
                font-size: 3.2rem;
                letter-spacing: 3px;
            }
        }

        /* Broodtekst - Altijd vast op Inter */
        .gradient-overlay p {
            font-family: 'Inter', sans-serif;
            font-weight: 300;
            font-size: 1.2rem;
