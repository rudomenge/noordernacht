<!-- Versie: 35.2 - Noordernacht: ster/logo/foto-script los van SoundCloud, SoundCloud async + foutmeldingen -->
<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noordernacht</title>

    <!-- Google Fonts: Unbounded (Headers/Knoppen) + Inter (Broodtekst) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&family=Unbounded:wght@400..900&display=swap" rel="stylesheet">

    <style>
        :root {
            --accent: #ff9b56;
            --accent-hover: #ffae70;
            --accent-glow: rgba(255, 155, 86, 0.35);
            --accent-glow-hover: rgba(255, 155, 86, 0.55);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: 'Inter', sans-serif;
            background-color: #000;
            color: #ffffff;
            scroll-behavior: smooth;
            overflow-x: hidden;
        }

        /* Klein versienummer linksboven */
        .version-tag {
            position: fixed;
            top: 12px;
            left: 14px;
            z-index: 60;
            font-family: 'Inter', sans-serif;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.5);
            pointer-events: none;
        }

        @media (min-width: 640px) {
            .version-tag {
                top: 20px;
                left: 20px;
            }
        }

        /* Hulpklassen: andere regelafbreking en andere tekst per schermbreedte */
        .d-only { display: none; }
        .m-only { display: inline; }

        @media (min-width: 640px) {
            .m-br { display: none; }
            .d-only { display: inline; }
            .m-only { display: none; }
        }

        /* SoundCloud-speler: klein pilletje linksonder. Muziek staat standaard uit. */
        .sc-player {
            position: fixed;
            left: 20px;
            bottom: 20px;
            z-index: 55;
            display: flex;
            align-items: center;
            gap: 10px;
            max-width: calc(100vw - 40px);
            padding: 5px 16px 5px 5px;
            border-radius: 9999px;
            background: rgba(11, 11, 11, 0.6);
            -webkit-backdrop-filter: blur(8px);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .sc-player.is-playing {
            border-color: var(--accent);
            box-shadow: 0 0 16px var(--accent-glow);
        }

        .sc-toggle {
            width: 34px;
            height: 34px;
            flex: 0 0 auto;
            border-radius: 50%;
            border: none;
            outline: none;
            background: var(--accent);
            color: #0b0b0b;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.3s ease, background-color 0.3s ease, opacity 0.3s ease;
        }

        .sc-toggle:hover {
            background: var(--accent-hover);
            transform: scale(1.08);
        }

        .sc-toggle:focus-visible {
            outline: 2px solid #ffffff;
            outline-offset: 3px;
        }

        .sc-toggle svg {
            width: 16px;
            height: 16px;
        }

        /* Play-icoon staat een tikje naar rechts, zodat het optisch gecentreerd is */
        .sc-toggle .icon-play { margin-left: 2px; }
        .sc-toggle .icon-pause { display: none; }
        .sc-player.is-playing .icon-play { display: none; }
        .sc-player.is-playing .icon-pause { display: block; }

        .sc-player.is-loading .sc-toggle {
            opacity: 0.5;
            cursor: default;
        }

        .sc-player.is-loading .sc-toggle:hover {
            transform: none;
            background: var(--accent);
        }

        /* Zachte pulserende ring tot de bezoeker voor het eerst klikt */
        .sc-player.invite:not(.is-loading) .sc-toggle {
            animation: sc-pulse 2.4s ease-out infinite;
        }

        @keyframes sc-pulse {
            0%   { box-shadow: 0 0 0 0 rgba(255, 155, 86, 0.55); }
            70%  { box-shadow: 0 0 0 12px rgba(255, 155, 86, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 155, 86, 0); }
        }

        .sc-info {
            display: flex;
            flex-direction: column;
            min-width: 0;
            line-height: 1.3;
        }

        .sc-title {
            font-family: 'Inter', sans-serif;
            font-size: 11px;
            font-weight: 700;
            color: #ffffff;
            text-decoration: none;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 150px;
            transition: color 0.3s ease;
        }

        .sc-title:hover { color: var(--accent); }

        .sc-artist {
            font-family: 'Inter', sans-serif;
            font-size: 10px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.6);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 150px;
        }

        /* Kleine equalizer, alleen zichtbaar tijdens afspelen */
        .sc-eq {
            display: none;
            align-items: flex-end;
            gap: 2px;
            height: 12px;
            flex: 0 0 auto;
        }

        .sc-player.is-playing .sc-eq { display: flex; }

        .sc-eq i {
            display: block;
            width: 2px;
            height: 4px;
            background: var(--accent);
            border-radius: 1px;
            animation: sc-eq 0.9s ease-in-out infinite;
        }

        .sc-eq i:nth-child(2) { animation-delay: 0.2s; }
        .sc-eq i:nth-child(3) { animation-delay: 0.4s; }

        @keyframes sc-eq {
            0%, 100% { height: 3px; }
            50%      { height: 12px; }
        }

        /* Verborgen SoundCloud-frame: 1px in beeld en onzichtbaar. Levert alleen het geluid. */
        .sc-frame {
            position: fixed;
            left: 0;
            bottom: 0;
            width: 1px;
            height: 1px;
            border: 0;
            opacity: 0;
            pointer-events: none;
        }

        @media (min-width: 640px) {
            .sc-player {
                left: 60px;
                bottom: 60px;
                gap: 14px;
                padding: 6px 24px 6px 6px;
            }

            .sc-toggle {
                width: 44px;
                height: 44px;
            }

            .sc-toggle svg {
                width: 20px;
                height: 20px;
            }

            .sc-title {
                font-size: 14px;
                max-width: 240px;
            }

            .sc-artist {
                font-size: 12px;
                max-width: 240px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .sc-player.invite .sc-toggle,
            .sc-eq i { animation: none; }
        }

        /* Hero Container */
        .hero {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-color: #000;
        }

        /* Background Video */
        .hero video {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translate(-50%, -50%);
            object-fit: cover;
            z-index: 1;
            filter: brightness(0.7);
        }

        /* Subtiele Interlace Overlay */
        .hero-interlace-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%,
                rgba(0, 0, 0, 0.3) 50%
            );
            background-size: 100% 4px;
            opacity: 0.5;
        }

        /* Knoppen bovenin: Tickets rechts, Agenda links (alleen desktop) */
        .ticket-btn-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 50;
        }

        .agenda-btn-container {
            position: fixed;
            top: 60px;
            left: 60px;
            z-index: 50;
            display: none;
        }

        .top-btn,
        .bottom-ticket-btn {
            background-color: var(--accent);
            color: #0b0b0b;
            padding: 2px 13px;
            border-radius: 9999px;
            font-family: 'Unbounded', sans-serif;
            font-weight: 800;
            font-size: 0.85rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 4px 20px var(--accent-glow);
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
            outline: none;
        }

        .top-btn:hover,
        .bottom-ticket-btn:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 6px 28px var(--accent-glow-hover);
        }

        @media (min-width: 640px) {
            .ticket-btn-container {
                top: 60px;
                right: 60px;
            }

            .agenda-btn-container { display: block; }

            .top-btn {
                font-size: 1.6rem;
                padding: 5px 24px;
            }

            .bottom-ticket-btn {
                font-size: 2rem;
                padding: 5px 40px;
            }
        }

        /* Hero Content */
        .hero-content {
            position: relative;
            z-index: 30;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 50px 20px 0 20px;
        }

        .hero-logo {
            display: block;
            width: 81vw;
            max-width: 81vw;
            height:
